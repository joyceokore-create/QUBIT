<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>QUBIT — Delivery & Reporting Workflow Wireframes</title>
<style>
  :root{
    --ink:#1f2328; --ink2:#3a4149; --ink3:#697079; --ink4:#98a0a8; --ink5:#c2c8ce;
    --line:#d7dce1; --line2:#e7ebee; --paper:#ffffff; --wash:#f5f7f8; --wash2:#eef1f3;
    --brand:#ED1C24; --brandwash:#fdecec; --annot:#8250df; --annotwash:#f3eefc;
    --ok:#1a7f43; --okw:#e7f4ec; --warn:#9a6700; --warnw:#fbf3e0; --bad:#b42318; --badw:#fdeceb;
    --r:10px; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--wash);font-size:13.5px;line-height:1.45}
  a{color:inherit;text-decoration:none;cursor:pointer}
  .app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}
  /* Sidebar */
  .side{background:var(--paper);border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:0;height:100vh;overflow:auto}
  .logo{display:flex;align-items:center;gap:8px;padding:6px 8px 12px;font-weight:800;letter-spacing:-.4px;font-size:16px}
  .logo .dot{width:16px;height:16px;border-radius:5px;background:var(--brand)}
  .nav a{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;color:var(--ink2);font-weight:600;font-size:12.5px;margin-bottom:1px}
  .nav a .ic{width:15px;height:15px;border:1.5px solid var(--ink4);border-radius:4px;flex:none}
  .nav a.on{background:var(--brandwash);color:var(--brand)}
  .nav a.on .ic{border-color:var(--brand)}
  .nav a.dim{opacity:.4}
  .nav .grp{font-size:9.5px;text-transform:uppercase;letter-spacing:1.4px;color:var(--ink4);padding:12px 10px 5px;font-weight:700}
  /* Topbar */
  .top{display:flex;align-items:center;gap:14px;padding:10px 22px;background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .crumbs{font-size:12px;color:var(--ink3);font-weight:600}
  .crumbs b{color:var(--ink)}
  .spacer{flex:1}
  .roleswitch{display:flex;gap:3px;background:var(--wash2);padding:3px;border-radius:9px}
  .roleswitch button{border:0;background:transparent;font:inherit;font-size:11.5px;font-weight:700;color:var(--ink3);padding:5px 10px;border-radius:6px;cursor:pointer}
  .roleswitch button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .who{font-size:11px;color:var(--ink4);font-weight:600}
  /* Main */
  main{padding:22px 26px 80px;max-width:1180px}
  h1{font-size:22px;letter-spacing:-.5px;margin:0 0 3px}
  .sub{color:var(--ink3);font-size:12.5px;margin:0 0 18px}
  h2{font-size:14px;letter-spacing:-.2px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
  h2 .pill{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--ink4);border:1px solid var(--line);border-radius:20px;padding:2px 8px}
  /* Cards & primitives */
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:15px}
  .grid{display:grid;gap:12px}
  .g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
  .muted{color:var(--ink3)}
  .ph{background:var(--wash2);border:1px dashed var(--line);border-radius:7px;color:var(--ink4);display:flex;align-items:center;justify-content:center;font-size:11px;text-align:center}
  .bar{height:7px;border-radius:20px;background:var(--wash2);overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--ink3)}
  .kpi{font-size:26px;font-weight:800;letter-spacing:-1px}
  .lbl{font-size:9.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--ink4);font-weight:700}
  .rag{display:inline-block;width:9px;height:9px;border-radius:50%}
  .rag.g{background:var(--ok)}.rag.a{background:var(--warn)}.rag.r{background:var(--bad)}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--ink3);background:var(--wash)}
  .tag.ok{background:var(--okw);color:var(--ok);border-color:transparent}
  .tag.warn{background:var(--warnw);color:var(--warn);border-color:transparent}
  .tag.bad{background:var(--badw);color:var(--bad);border-color:transparent}
  .tag.info{background:var(--annotwash);color:var(--annot);border-color:transparent}
  .btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 12px;font-size:12px;font-weight:700;color:var(--ink2);cursor:pointer}
  .btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn.sm{padding:5px 9px;font-size:11px}
  .row{display:flex;align-items:center;gap:10px}
  .between{display:flex;align-items:center;justify-content:space-between;gap:10px}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{text-align:left;font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:var(--ink4);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line)}
  td{padding:10px;border-bottom:1px solid var(--line2)}
  tr:last-child td{border-bottom:0}
  tr.clk:hover{background:var(--wash);cursor:pointer}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:4px 0 16px;flex-wrap:wrap}
  .tabs button{border:0;background:transparent;font:inherit;font-weight:700;font-size:12.5px;color:var(--ink3);padding:9px 13px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
  .tabs button:disabled{opacity:.35;cursor:not-allowed}
  /* Annotation callouts explain the workflow rules */
  .annot{border-left:3px solid var(--annot);background:var(--annotwash);border-radius:0 8px 8px 0;padding:9px 12px;font-size:11.5px;color:#54308c;margin:10px 0}
  .annot b{color:var(--annot)}
  .annot::before{content:"◆ design note — ";font-weight:800;color:var(--annot)}
  .empty{border:1px dashed var(--line);border-radius:var(--r);padding:24px;text-align:center;color:var(--ink4);font-size:12px}
  .swim{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .lane{background:var(--wash);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-height:170px}
  .lane .h{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3);margin-bottom:8px;display:flex;justify-content:space-between}
  .tkt{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px;margin-bottom:8px;font-size:12px}
  .tkt .m{font-size:10.5px;color:var(--ink4);margin-top:5px;display:flex;gap:8px;align-items:center}
  .av{width:18px;height:18px;border-radius:50%;background:var(--wash2);border:1px solid var(--line);font-size:9px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink3);font-weight:700}
  .banner{display:flex;align-items:center;gap:12px;background:var(--warnw);border:1px solid #f0dca6;border-radius:var(--r);padding:11px 14px;margin-bottom:14px;font-size:12.5px;color:#6b4a00}
  .banner .btn{margin-left:auto}
  .heat{display:grid;gap:4px}
  .heat .hr{display:grid;grid-template-columns:150px repeat(7,1fr);gap:4px;align-items:center}
  .heat .hc{height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}
  .heat .hh{font-size:9.5px;color:var(--ink4);font-weight:700;text-align:center}
  .heat .rl{font-size:11.5px;font-weight:600}
  textarea,.inp{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit;font-size:12.5px;color:var(--ink)}
  .legend{font-size:10.5px;color:var(--ink4);display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
  .step{display:flex;gap:0;margin:0 0 16px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .step div{flex:1;padding:9px 12px;font-size:11.5px;font-weight:700;color:var(--ink4);border-right:1px solid var(--line);text-align:center}
  .step div.on{background:var(--brandwash);color:var(--brand)}
  .step div:last-child{border-right:0}
  /* Wizard chrome (docs/26 §5): left rail of steps, one question per step, draft autosave */
  .wiz{display:grid;grid-template-columns:190px 1fr;gap:18px;align-items:start}
  .wrail{position:sticky;top:64px;display:flex;flex-direction:column;gap:2px}
  .wrail a{display:flex;gap:9px;align-items:center;padding:8px 10px;border-radius:8px;font-size:12px;font-weight:600;color:var(--ink3)}
  .wrail a .n{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--ink5);font-size:10px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none}
  .wrail a.on{background:var(--brandwash);color:var(--brand)}
  .wrail a.on .n{border-color:var(--brand);color:var(--brand)}
  .wrail a.done{color:var(--ok)}
  .wrail a.done .n{border-color:var(--ok);background:var(--okw)}
  .wrail a.skip{opacity:.4}
  .wrail .draft{margin-top:10px;font-size:10.5px;color:var(--ink4);padding:0 10px;line-height:1.5}
  .opt{border:1.5px solid var(--line);border-radius:var(--r);padding:13px;cursor:pointer;background:var(--paper)}
  .opt.on{border-color:var(--brand);background:var(--brandwash)}
  .opt .t{font-weight:800;margin-bottom:3px}
  .opt .d{font-size:11.5px;color:var(--ink3)}
  .chip{display:inline-flex;align-items:center;gap:5px;border:1.5px solid var(--line);border-radius:20px;padding:4px 11px;font-size:11.5px;font-weight:700;color:var(--ink3);cursor:pointer;margin:0 6px 6px 0;background:var(--paper)}
  .chip.on{border-color:var(--brand);color:var(--brand);background:var(--brandwash)}
  .warnrow{display:flex;gap:8px;align-items:flex-start;background:var(--warnw);border:1px solid #f0dca6;border-radius:8px;padding:8px 10px;font-size:11.5px;color:#6b4a00;margin-top:8px}
  .okrow{display:flex;gap:8px;align-items:flex-start;background:var(--okw);border:1px solid #bfe3cd;border-radius:8px;padding:8px 10px;font-size:11.5px;color:var(--ok);margin-top:8px}
  .err{font-size:11px;color:var(--bad);margin-top:4px}
  . role-hide{display:none}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="logo"><span class="dot"></span> QUBIT</div>
    <nav class="nav" id="nav"></nav>
    <div style="margin-top:18px;font-size:10px;color:var(--ink4);padding:0 10px;line-height:1.5">
      Low-fi wireframe · Riverbank tenant<br>docs/24–25 + docs/26 §4.3 · §5 wizards
    </div>
  </aside>
  <div>
    <div class="top">
      <div class="crumbs" id="crumbs"></div>
      <div class="spacer"></div>
      <span class="who">Viewing as</span>
      <div class="roleswitch" id="roles"></div>
    </div>
    <main id="main"></main>
  </div>
</div>

<script>
/* ---------- state ---------- */
const ROLES = [
  ["exec","Executive"],["pm","Project Manager"],["member","Dev · QA · Impl"],["head","Head of PMs"]
];
const NAV = [
  ["dashboard","Dashboard"],["portfolio","Portfolio"],["programme","Programme"],
  ["projects","Projects"],["reports","Reports"],["people","Teams & People"]
];
const state = { role:"pm", screen:"dashboard", tab:"overview" };
/* Wizard step state (docs/26 §5): pf = portfolio, pj = project. Draft autosave is the
   contract — a wizard abandoned mid-way resumes at its last step. */
const WIZ = { pf:1, pj:1 };
function wgo(w,s){ WIZ[w]=s; window.scrollTo(0,0); render(); }

/* ---------- helpers ---------- */
const el = (id)=>document.getElementById(id);
const annot = (t)=>`<div class="annot">${t}</div>`;
function go(screen,tab){ state.screen=screen; if(tab)state.tab=tab; window.scrollTo(0,0); render(); }
function setRole(r){ state.role=r; if(state.screen==="board"||state.screen==="memberReport") {} render(); }
function bars(v){ return `<div class="bar"><i style="width:${v}%"></i></div>`; }
const roleName = ()=>Object.fromEntries(ROLES)[state.role];
/* Shared wizard chrome (docs/26 §5): left rail, ticked steps, draft note. skipIdx marks a
   conditionally-skipped step (e.g. Markets on a Pipeline portfolio). */
function rail(w, steps, skipIdx){
  return `<div class="wrail">${steps.map((l,i)=>{
    const n=i+1;
    const cls = (skipIdx===n) ? "skip" : n===WIZ[w] ? "on" : n<WIZ[w] ? "done" : "";
    return `<a class="${cls}" onclick="wgo('${w}',${n})"><span class="n">${n<WIZ[w]&&skipIdx!==n?"✓":n}</span>${l}</a>`;
  }).join("")}
  <div class="draft">✎ Draft auto-saves at every step — leave and resume anytime.</div></div>`;
}
function wfoot(w, step, last, createLabel, doneScreen){
  return `<div class="row" style="margin-top:16px">
    ${step>1?`<span class="btn" onclick="wgo('${w}',${step-1})">← Back</span>`:""}
    ${step<last?`<span class="btn pri" onclick="wgo('${w}',${step+1})">Continue →</span>`
               :`<span class="btn pri" onclick="WIZ['${w}']=1;go('${doneScreen}')">${createLabel}</span><span class="btn" onclick="WIZ['${w}']=1;render()">Create another</span>`}
  </div>`;
}

/* ---------- screens ---------- */
const S = {};

S.dashboard = ()=>{
  if(state.role==="exec") return `
    <h1>Dashboard</h1><p class="sub">Executive view · everything, read-only</p>
    ${annot("From your notes: <b>(i) an AI brief of actions needed + urgent look-outs</b>, then <b>(ii) cards on overall portfolios / programmes / projects</b> that link through to their pages, then the <b>(iv) market rollout heat map</b>.")}
    <div class="card" style="border-left:3px solid var(--brand)">
      <div class="lbl">AI brief · generated ${'8:00'} today</div>
      <p style="margin:6px 0 8px">2 decisions need you: <b>ZED ERP</b> stage-gate approval is waiting, and the <b>Swipe Agent Banking</b> UAT sign-off is overdue.</p>
      <div class="row"><span class="tag bad">⚠ Mobile Banking running behind — milestone slipped 6d</span><span class="tag warn">Fikra AI · QA capacity −40% next week</span></div>
    </div>
    <h2>Portfolios <span class="pill">click a card → its page</span></h2>
    <div class="grid g3">
      ${["AI Initiatives·Pipeline·8 projects","ZED ERP·Rollout·5 modules","Swipe Agent Banking·Rollout·4 modules"].map(x=>{const[a,b,c]=x.split("·");return `
      <a class="card" onclick="go('portfolioDetail')">
        <div class="between"><b>${a}</b><span class="rag ${a[0]==='S'?'r':a[0]==='Z'?'a':'g'}"></span></div>
        <div class="muted" style="font-size:11.5px;margin:3px 0 10px">${b} · ${c}</div>
        ${bars(a[0]==='S'?48:a[0]==='Z'?66:81)}
        <div class="row" style="margin-top:8px"><span class="tag ok">Approved</span><span class="muted" style="font-size:11px">▲ 3% WoW</span></div>
      </a>`}).join("")}
    </div>
    <h2>Market rollout heat map <span class="pill">portfolio-projects × subsidiaries</span></h2>
    <div class="card">${heatmap()}</div>`;

  if(state.role==="head") return `
    <h1>Dashboard</h1><p class="sub">Head of PMs · delivery governance across all portfolios</p>
    ${annot("The Head's home is the <b>cross-PM roll-up review queue</b> (docs/19 §6): confirmed PM check-ins roll up here to review + approve before they reach the executive. Plus one-click export.")}
    <div class="grid g4">
      ${[["6","PM check-ins in","ok"],["2","Unconfirmed","warn"],["3","Red projects","bad"],["1","Awaiting my approval","info"]].map(([n,l,t])=>`
      <div class="card"><div class="kpi">${n}</div><div class="lbl">${l}</div><div style="margin-top:6px"><span class="tag ${t}">week 32</span></div></div>`).join("")}
    </div>
    <h2>Roll-up review queue</h2>
    <div class="card" style="padding:0">
      <table><thead><tr><th>Portfolio / Programme</th><th>PM</th><th>RAG</th><th>Status</th><th></th></tr></thead><tbody>
      ${[["ZED ERP","A. Mwangi","a","Submitted"],["Swipe Agent Banking","J. Otieno","r","Submitted"],["AI Initiatives","P. Kamau","g","Unconfirmed"]].map(([p,pm,r,s])=>`
      <tr class="clk" onclick="go('pmReport')"><td><b>${p}</b></td><td>${pm}</td><td><span class="rag ${r}"></span></td><td><span class="tag ${s==='Submitted'?'info':'warn'}">${s}</span></td><td style="text-align:right"><span class="btn sm">Review →</span></td></tr>`).join("")}
      </tbody></table>
    </div>
    <div class="row" style="margin-top:12px"><span class="btn">⤓ Export portfolio pack (PDF)</span><span class="btn">⤓ Export resource allocations</span></div>`;

  if(state.role==="member") return `
    <h1>Dashboard</h1><p class="sub">Dev · QA · Implementor · your work across projects</p>
    ${annot("Members don't manage projects. Their home nudges them toward <b>this week's updates</b> and shows their tasks (read-only, from YouTrack) and the queries they've raised.")}
    <div class="banner">⏰ <b>2 weekly updates due</b> for Mobile Banking and Fikra AI — send or edit your draft before Fri 5pm.<a class="btn sm" onclick="go('memberReport')">Review drafts →</a></div>
    <div class="grid g3">
      <div class="card"><div class="lbl">My open tasks (YouTrack)</div><div class="kpi">7</div><div class="muted" style="font-size:11px">3 in review · 1 blocked</div></div>
      <div class="card"><div class="lbl">Done this week</div><div class="kpi">8</div><div class="muted" style="font-size:11px">feeds your weekly update</div></div>
      <div class="card"><div class="lbl">Queries I raised</div><div class="kpi">2</div><div class="muted" style="font-size:11px">1 answered by PM</div></div>
    </div>
    <h2>My projects</h2>
    <div class="grid g2">
      ${["Mobile Banking·Developer","Fikra AI·QA Engineer"].map(x=>{const[a,b]=x.split("·");return `
      <a class="card" onclick="go('workspace','board')"><div class="between"><b>${a}</b><span class="tag">${b}</span></div><div class="muted" style="font-size:11.5px;margin-top:4px">Open project workspace →</div></a>`}).join("")}
    </div>`;

  // PM
  return `
    <h1>Dashboard</h1><p class="sub">Project Manager · your projects this week</p>
    ${annot("PM home (the one spot your notes left open) — proposed: <b>check-in status</b>, <b>my projects (RAG + Δ)</b>, an <b>action queue</b>, and <b>team load</b>. Confirm or tweak.")}
    <div class="banner">📝 <b>Friday check-in due</b> for 3 projects. Drafts are ready from this week's board activity — confirm each in ~2 min.<a class="btn sm pri" onclick="go('pmReport')">Open check-ins →</a></div>
    <h2>My projects</h2>
    <div class="card" style="padding:0"><table>
      <thead><tr><th>Project</th><th>RAG</th><th>Progress</th><th>Next milestone</th><th>Blockers</th><th></th></tr></thead><tbody>
      ${[["Mobile Banking","r","62","UAT · 12 Aug","2"],["Fikra AI","g","81","Go-Live · 20 Aug","0"],["ZED Card","a","55","SIT · 15 Aug","1"]].map(([p,r,pg,m,b])=>`
      <tr class="clk" onclick="go('workspace','overview')"><td><b>${p}</b></td><td><span class="rag ${r}"></span></td><td style="width:120px">${bars(pg)}</td><td>${m}</td><td>${b==='0'?'<span class="tag ok">none</span>':'<span class="tag bad">'+b+' open</span>'}</td><td style="text-align:right"><span class="btn sm">Open →</span></td></tr>`).join("")}
    </tbody></table></div>
    <h2>Action queue</h2>
    <div class="grid g2">
      <div class="card"><b>Approvals & handoffs</b><ul style="margin:8px 0 0;padding-left:16px;color:var(--ink2)"><li>Member report from D. Wanjiru — acknowledge</li><li>Blocker &gt;3 days on Mobile Banking</li></ul></div>
      <div class="card"><b>Team load</b><div class="muted" style="font-size:11.5px;margin:6px 0 8px">across my projects · leave-aware</div>${bars(92)}<div class="muted" style="font-size:11px;margin-top:6px">2 people &gt;90% next week · 1 on leave</div></div>
    </div>`;
};

S.portfolio = ()=>`
  <div class="between"><div><h1>Portfolio</h1><p class="sub">Square cards of every portfolio · categorized Approved / Exploring / Shelved</p></div>
  ${(state.role==="exec"||state.role==="head")?'<span class="btn pri" onclick="go(\'newPortfolio\')">+ New portfolio</span>':''}</div>
  ${annot("From your notes: <b>Portfolio page = square cards with an “Add New Portfolio” button</b>. Only Exec / Head see the add button; PM & members see cards only.")}
  ${["Approved","Exploring","Shelved"].map(cat=>`
    <h2>${cat} <span class="pill">${cat==='Approved'?3:cat==='Exploring'?2:1}</span></h2>
    <div class="grid g3">
    ${(cat==='Approved'?["AI Initiatives","ZED ERP","Swipe Agent Banking"]:cat==='Exploring'?["Data Platform","Open Banking"]:["Legacy Cards"]).map(p=>`
      <a class="card" onclick="go('portfolioDetail')" style="aspect-ratio:1.6/1;display:flex;flex-direction:column;justify-content:space-between">
        <div class="between"><b>${p}</b><span class="rag ${cat==='Shelved'?'r':cat==='Exploring'?'a':'g'}"></span></div>
        <div><div class="lbl">Projects</div><div class="kpi" style="font-size:20px">${cat==='Approved'?'5':cat==='Exploring'?'2':'3'}</div></div>
        <div class="row"><span class="tag ${cat==='Approved'?'ok':cat==='Exploring'?'warn':''}">${cat}</span><span class="muted" style="font-size:11px">2 programmes</span></div>
      </a>`).join("")}

/* ---------- shared heatmap ---------- */
function heatmap(){
  const cols=["KE","TZ","UG","RW","BI","SS","DRC"];
  const rows=[["POS",["g","g","a","r","o","o","o"]],["USSD",["g","a","a","o","o","o","o"]],["Agent Portal",["g","g","g","a","r","o","o"]],["Mobile App",["a","a","o","o","o","o","o"]]];
  const c={g:"var(--ok)",a:"var(--warn)",r:"var(--bad)",o:"var(--ink5)"};
  const t={g:"Live",a:"WIP",r:"Blocked",o:"—"};
  return `<div class="heat">
    <div class="hr"><div></div>${cols.map(x=>`<div class="hh">${x}</div>`).join("")}</div>
    ${rows.map(([r,cells])=>`<div class="hr"><div class="rl">${r}</div>${cells.map(x=>`<div class="hc" style="background:${c[x]}">${t[x]}</div>`).join("")}</div>`).join("")}
  </div>
  <div class="legend"><span><span class="rag g"></span> Live</span><span><span class="rag a"></span> In progress</span><span><span class="rag r"></span> Blocked</span><span style="color:var(--ink5)">— not started</span> · click a cell → that project-market's checkpoints + check-in</div>`;
}

/* ---------- chrome ---------- */
function render(){
  // roles
  el("roles").innerHTML = ROLES.map(([k,l])=>`<button class="${state.role===k?'on':''}" onclick="setRole('${k}')">${l}</button>`).join("");
  // nav (member gets a slimmer, dimmed nav to show scope)
  const memberHidden = new Set(["portfolio","programme","people"]);
  el("nav").innerHTML = `<div class="grp">Workspace</div>` + NAV.map(([k,l])=>{
    const dim = state.role==="member" && memberHidden.has(k);
    const on = state.screen===k || (k==="projects" && ["workspace"].includes(state.screen)) || (k==="portfolio" && ["portfolioDetail","newPortfolio"].includes(state.screen)) || (k==="reports" && ["pmReport","memberReport"].includes(state.screen));
    return `<a class="${on?'on':''} ${dim?'dim':''}" onclick="go('${k}')"><span class="ic"></span>${l}</a>`;
  }).join("") +
  ((state.role==="exec"||state.role==="head")?`<div class="grp">Create</div><a class="${state.screen==='newPortfolio'?'on':''}" onclick="go('newPortfolio')"><span class="ic"></span>New portfolio</a><a class="${state.screen==='newProgramme'?'on':''}" onclick="go('newProgramme')"><span class="ic"></span>New programme</a><a class="${state.screen==='newProject'?'on':''}" onclick="go('newProject')"><span class="ic"></span>New project</a>`:"") +
  ((state.role==="pm"||state.role==="head")?`<div class="grp">Staffing</div><a class="${state.screen==='resourceReq'?'on':''}" onclick="go('resourceReq')"><span class="ic"></span>Resource requests</a>`:"");
  // crumbs
  el("crumbs").innerHTML = `QUBIT · <b>${Object.fromEntries(NAV)[state.screen]||({workspace:'Project workspace',portfolioDetail:'Portfolio',pmReport:'Report',memberReport:'My update',newPortfolio:'New portfolio',newProgramme:'New programme',newProject:'New project',assign:'Add to team',resourceReq:'Resource requests'})[state.screen]||state.screen}</b>`;
  // body
  const fn = S[state.screen] || S.dashboard;
  el("main").innerHTML = fn();
}
render();
