# M9 CI (docs/16 §12) — the same gates the Definition of Done runs locally:
# lint, typecheck, unit + RLS tests against a real Postgres 17 with migrations and seed,
# a production build, and the Playwright smoke. Secrets below are SYNTHETIC test values
# (the RLS suites need *a* 32-byte key, not a real one); production secrets never enter CI.
name: ci

on:
  push:
    branches: [main, Development] # Development = the shared integration branch (Joyce + Alex); every merge there runs the gates
  pull_request:

env:
  DATABASE_URL: postgresql://qubit:qubit@localhost:5432/qubit_ci?schema=public
  # Synthetic 32-byte base64 key for encryptSecret()/MFA in tests — not a real secret.
  MFA_ENCRYPTION_KEY: QUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUFBQUE=
  AUTH_SECRET: ci-only-auth-secret-not-production
  AUTH_TRUST_HOST: "true"

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: qubit
          POSTGRES_PASSWORD: qubit
          POSTGRES_DB: qubit_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qubit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm's --frozen-lockfile can skip the prisma postinstall, leaving tsx seed.ts to
      # fail on `Cannot find module '.prisma/client/default'`. Generate the client first.
      - run: pnpm prisma generate
      - run: pnpm prisma migrate deploy
      - run: pnpm prisma db seed
      # The postgres service makes POSTGRES_USER=qubit the BOOTSTRAP superuser, which
      # bypasses RLS — so the tenant-isolation suite would see every tenant's rows — and
      # Postgres refuses to demote the bootstrap role ("must have the SUPERUSER attribute").
      # migrate+seed need the elevated role; the tests run as a second, non-superuser login
      # that merely has privileges on the schema, so `pnpm test` runs under RLS exactly as
      # prod/local do (non-owner role + FORCE RLS). Same intent as the old ALTER ROLE step.
      - run: |
          cat <<'SQL' | pnpm prisma db execute --stdin --schema prisma/schema.prisma
          CREATE ROLE qubit_rls LOGIN PASSWORD 'qubit_rls' NOSUPERUSER NOCREATEDB NOCREATEROLE;
          GRANT USAGE ON SCHEMA public TO qubit_rls;
          GRANT ALL PRIVILEGES ON ALL TABLES IN SCHEMA public TO qubit_rls;
          GRANT ALL PRIVILEGES ON ALL SEQUENCES IN SCHEMA public TO qubit_rls;
          SQL
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          DATABASE_URL: postgresql://qubit_rls:qubit_rls@localhost:5432/qubit_ci?schema=public
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: qubit
          POSTGRES_PASSWORD: qubit
          POSTGRES_DB: qubit_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U qubit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - run: pnpm prisma migrate deploy
      - run: pnpm prisma db seed
      - run: npx playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
